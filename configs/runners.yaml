# AgentCell built-in runner presets (embedded at build time).
# Override or extend via /etc/agentcell/runners.d/*.yaml — user files win.
#
# Runners are data for the same reason providers are: a CLI's flags are the
# fastest-moving thing in this system. When an upstream release renames
# `--resume`, an operator should fix one line, not wait for an AgentCell
# release. Everything here is a last-known-good value.
#
# argv templates substitute {{task}} and {{session}} as WHOLE elements — a
# task containing spaces or a semicolon stays one argument. See
# docs/adr/0002-provider-access-layer.md and ADR-0010 for the conversation
# model.
version: 1

runners:
  claude:
    display_name: Claude Code
    vendor: anthropic
    # Preference order; first protocol the provider also speaks wins.
    protocols: [anthropic]
    headless: ["claude", "--dangerously-skip-permissions", "-p", "{{task}}"]
    # How a person starts it. A resident session runs this, so the terminal
    # shows Claude Code's own interface rather than the tail of a process
    # that has already exited.
    interactive: ["claude", "--dangerously-skip-permissions"]
    # Claude Code accepts a caller-chosen conversation id, and requires a
    # UUID — AgentCell mints one per Session and records it.
    session_id: uuid
    start:  ["claude", "--dangerously-skip-permissions", "--session-id", "{{session}}", "-p", "{{task}}"]
    resume: ["claude", "--dangerously-skip-permissions", "--resume", "{{session}}", "-p", "{{task}}"]

  codex:
    display_name: OpenAI Codex CLI
    vendor: openai
    protocols: [openai]
    # The container is the boundary; Codex's inner sandbox must yield to it.
    headless: ["codex", "exec", "--sandbox", "danger-full-access", "{{task}}"]
    interactive: ["codex", "--sandbox", "danger-full-access"]
    # Codex names its own conversations and resumes the most recent one, so
    # each Session needs its own state directory — a user's windows share a
    # runtime and a $HOME, and "the last one" would otherwise be a sibling's.
    session_home_env: CODEX_HOME
    resume: ["codex", "exec", "resume", "--last", "--sandbox", "danger-full-access", "{{task}}"]
    # Codex picks its endpoint and model from config, NOT from OPENAI_BASE_URL
    # and OPENAI_MODEL. Setting only the environment leaves it talking to
    # api.openai.com with its own default model — which is how a session
    # dispatched at DeepSeek announced itself as gpt-5.6-sol and then spent
    # its life reconnecting to a host the cluster cannot reach. The failure
    # is silent in the worst way: the run looks alive, and nothing says the
    # provider you chose was discarded.
    #
    # wire_api: Codex 0.147 REMOVED "chat" — it now speaks only the Responses
    # API. That is upstream's call, and it narrows this runner sharply: most
    # vendors' "OpenAI-compatible" endpoint is Chat Completions and nothing
    # else. Pair Codex with a provider that actually serves /responses, or
    # pair the provider with a runner that speaks Chat.
    config_file:
      path: config.toml
      template: |
        model = "{{model}}"
        model_provider = "agentcell"

        [model_providers.agentcell]
        name = "AgentCell"
        base_url = "{{base_url}}"
        env_key = "OPENAI_API_KEY"
        wire_api = "responses"

  pi:
    display_name: pi
    protocols: [anthropic, openai]
    headless: ["pi", "-p", "{{task}}"]

  kimi:
    display_name: Kimi Code CLI(月之暗面)
    vendor: moonshot
    protocols: [openai]
    # Just -p. The published flag reference says only --yolo and --plan
    # conflict with --prompt, but the shipped binary (0.36.1) refuses --auto
    # too: "Cannot combine --prompt with --auto." Print mode is already
    # non-interactive, so there is nothing to approve — and the binary is the
    # authority here, not the document.
    headless: ["kimi", "-p", "{{task}}"]
    # Plain `kimi` is the full interface: the welcome screen, /help, the
    # model line. Print mode has none of that by design — it answers once
    # and exits — which is why a resident terminal running -p looked like a
    # log rather than a place to work.
    # --yolo, for the same reason Claude gets --dangerously-skip-permissions
    # and Codex gets danger-full-access: the CONTAINER is the boundary. An
    # agent that stops to ask before every file write, in a terminal nobody
    # is necessarily watching, is an agent that silently does nothing.
    interactive: ["kimi", "--yolo"]
    # Kimi mints its own session ids, so the platform cannot name the
    # conversation up front. It resumes the most recent one in the working
    # directory instead — which is only unambiguous if each session has its
    # own state directory, exactly as Codex does.
    session_home_env: KIMI_CODE_HOME
    resume: ["kimi", "--continue", "-p", "{{task}}"]
    # Kimi reads credentials ONLY from config.toml. Its own documentation is
    # explicit that `export KIMI_API_KEY=…` is not picked up, so the file is
    # not a convenience here — without it the CLI fails at startup with
    # "provider is missing credentials".
    #
    # The key is therefore written into the file. It lands 0600 inside the
    # session's private 0700 tree, and the agent runs as that user, so it is
    # the same boundary the environment would have given (ADR-0010) — but a
    # file outlives the process, which is why it is per session rather than
    # per user.
    #
    # The model is declared as an alias equal to its own name, so `-m <model>`
    # takes whatever the dispatch asked for without a second naming scheme to
    # keep in sync.
    config_file:
      path: config.toml
      template: |
        default_model = "{{model}}"

        [providers.agentcell]
        type = "kimi"
        base_url = "{{base_url}}"
        api_key = "{{api_key}}"

        [models."{{model}}"]
        provider = "agentcell"
        model = "{{model}}"
        max_context_size = {{context_tokens}}
    # Used instead when the person has connected their Kimi account.
    #
    # base_url is NOT optional here even though the credential already says
    # which service issued it: without it the CLI sends a kimi-code token to
    # its own default endpoint and gets "401 Invalid Authentication" — an
    # error that reads like a bad token and is really a wrong address.
    #
    # NOT the same file with the key left out: the CLI decides how to
    # authenticate by what the provider block contains. With an api_key it
    # uses the key; with an `oauth` reference it looks up the credential it
    # stored at login; with neither it refuses ("provider … has no
    # credential configured"). The provider is named kimi-code because that
    # name is the lookup key for the stored credential — the login writes
    # credentials/<provider>.json.
    account_config_file:
      path: config.toml
      template: |
        default_model = "{{model}}"

        [providers.kimi-code]
        type = "kimi"
        base_url = "{{base_url}}"

        [providers.kimi-code.oauth]
        storage = "file"
        key = "kimi-code"

        [models."{{model}}"]
        provider = "kimi-code"
        model = "{{model}}"
        max_context_size = {{context_tokens}}
