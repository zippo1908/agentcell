# AgentCell built-in provider presets (embedded at build time).
# Override or extend via /etc/agentcell/providers.d/*.yaml — user files win.
#
# Endpoint URLs drift; these are last-known-good values. Any field here can
# be overridden without touching code. See docs/adr/0002-provider-access-layer.md.
version: 1

providers:
  anthropic:
    display_name: Anthropic
    region: global
    protocols:
      anthropic:
        base_url: https://api.anthropic.com
    auth_env: ANTHROPIC_API_KEY

  openai:
    display_name: OpenAI
    region: global
    protocols:
      openai:
        base_url: https://api.openai.com/v1
    auth_env: OPENAI_API_KEY

  aliyun-bailian:
    display_name: 阿里云百炼 (DashScope / 通义千问)
    region: cn
    protocols:
      openai:
        base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      anthropic:
        # Anthropic-compatible proxy for Claude Code; verify against the
        # current DashScope documentation before relying on it.
        base_url: https://dashscope.aliyuncs.com/api/v2/apps/claude-code-proxy
    auth_env: DASHSCOPE_API_KEY
    models: [qwen3-coder-plus, qwen-max]
    context_tokens: 131072
    docs: https://help.aliyun.com/zh/model-studio/

  tencent-hunyuan:
    display_name: 腾讯混元
    region: cn
    protocols:
      openai:
        base_url: https://api.hunyuan.cloud.tencent.com/v1
    auth_env: HUNYUAN_API_KEY
    docs: https://cloud.tencent.com/document/product/1729

  deepseek:
    display_name: DeepSeek
    region: cn
    protocols:
      openai:
        base_url: https://api.deepseek.com
      anthropic:
        base_url: https://api.deepseek.com/anthropic
    auth_env: DEEPSEEK_API_KEY
    models: [deepseek-chat, deepseek-reasoner]
    context_tokens: 131072

  kimi-code:
    display_name: Kimi Code(月之暗面托管)
    region: cn
    protocols:
      openai:
        # Kimi Code's own managed coding endpoint, which is what a Kimi Code
        # account is for. The open-platform key uses api.moonshot.ai instead —
        # that is the `moonshot` provider below.
        base_url: https://api.kimi.com/coding/v1
    auth_env: KIMI_API_KEY
    models: [k3, kimi-for-coding, kimi-for-coding-highspeed]
    context_tokens: 262144
    docs: https://moonshotai.github.io/kimi-code/

  moonshot:
    display_name: 月之暗面 Kimi
    region: cn
    protocols:
      openai:
        base_url: https://api.moonshot.cn/v1
      anthropic:
        # Anthropic-compatible endpoint, so Claude Code (and any
        # Anthropic-protocol runner) can drive Kimi models directly.
        base_url: https://api.moonshot.cn/anthropic
    auth_env: MOONSHOT_API_KEY
    # Model names move faster than releases; override in providers.d.
    models: [kimi-k2-turbo-preview, kimi-k2-0905-preview, moonshot-v1-128k]
    # Claude Code assumes 200k for a model name it does not recognise and
    # compacts early; saying the real window avoids truncating work the
    # model could have held.
    context_tokens: 262144
    docs: https://platform.moonshot.cn/docs

  zhipu:
    display_name: 智谱 GLM
    region: cn
    protocols:
      openai:
        base_url: https://open.bigmodel.cn/api/paas/v4
      anthropic:
        base_url: https://open.bigmodel.cn/api/anthropic
    auth_env: ZHIPUAI_API_KEY

  openrouter:
    display_name: OpenRouter
    region: global
    protocols:
      openai:
        base_url: https://openrouter.ai/api/v1
    auth_env: OPENROUTER_API_KEY

# Runners declare which protocols they speak; a (runner, provider, model)
# binding is valid iff the protocol sets intersect. Runner definitions are
# code (five-point interface, see docs/adr/0002), summarized here for
# reference only:
#
#   claude  -> anthropic            (env: ANTHROPIC_BASE_URL / ANTHROPIC_AUTH_TOKEN / ANTHROPIC_MODEL)
#   codex   -> openai               (env: OPENAI_BASE_URL / OPENAI_API_KEY; or ~/.codex/auth.json)
#   pi      -> openai + anthropic   (per-provider API key envs)
