<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12211a"/>
      <stop offset="1" stop-color="#0c1512"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a17b"/>
      <stop offset="1" stop-color="#8fd0ac"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <!-- faint grid -->
  <g stroke="#2a3b31" stroke-width="1" opacity="0.35">
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="860" y1="0" x2="860" y2="640"/>
  </g>

  <!-- left: wordmark + tagline -->
  <g transform="translate(96,150)">
    <!-- cell glyph -->
    <g transform="translate(0,-18)">
      <rect x="0" y="0" width="66" height="66" rx="16" fill="none" stroke="url(#accent)" stroke-width="4"/>
      <circle cx="33" cy="33" r="9" fill="#8fd0ac"/>
      <circle cx="19" cy="19" r="4.5" fill="#58a17b"/>
      <circle cx="47" cy="47" r="4.5" fill="#58a17b"/>
    </g>
    <text x="86" y="40" font-size="58" font-weight="700" fill="#eef3f0" letter-spacing="-1">AgentCell</text>

    <text x="0" y="150" font-size="35" font-weight="600" fill="#eef3f0">A workshop for AI coding agents</text>
    <text x="0" y="205" font-size="26" fill="#9db3a8">One resident instance per project.</text>
    <text x="0" y="242" font-size="26" fill="#9db3a8">Disposable session slots. SDLC loop</text>
    <text x="0" y="279" font-size="26" fill="#9db3a8">closed in-instance.</text>

    <g font-size="19" fill="#0c1512">
      <rect x="0" y="322" width="210" height="40" rx="20" fill="url(#accent)"/>
      <text x="105" y="348" text-anchor="middle" font-weight="700">Kubernetes-native</text>
      <rect x="226" y="322" width="140" height="40" rx="20" fill="none" stroke="#58a17b" stroke-width="2"/>
      <text x="296" y="348" text-anchor="middle" fill="#8fd0ac" font-weight="600">Self-hosted</text>
      <rect x="382" y="322" width="196" height="40" rx="20" fill="none" stroke="#58a17b" stroke-width="2"/>
      <text x="480" y="348" text-anchor="middle" fill="#8fd0ac" font-weight="600">China-cloud ready</text>
      <rect x="0" y="374" width="392" height="40" rx="20" fill="none" stroke="#3a5145" stroke-width="2"/>
      <text x="196" y="399" text-anchor="middle" fill="#9db3a8" font-weight="600" font-size="17">Agent code never sees your tokens</text>
    </g>
  </g>

  <!-- right: the loop -->
  <g transform="translate(925,150)" font-size="21" fill="#cde0d6">
    <g font-weight="700" fill="#8fd0ac">
      <circle cx="10" cy="0" r="6" fill="#58a17b"/><text x="30" y="7">dispatch</text>
    </g>
    <line x1="10" y1="14" x2="10" y2="52" stroke="#3a5145" stroke-width="2"/>
    <g transform="translate(0,66)"><circle cx="10" cy="0" r="6" fill="#58a17b"/><text x="30" y="7">work in a worktree</text></g>
    <line x1="10" y1="80" x2="10" y2="118" stroke="#3a5145" stroke-width="2"/>
    <g transform="translate(0,132)"><circle cx="10" cy="0" r="6" fill="#58a17b"/><text x="30" y="7">settle → push branch</text></g>
    <line x1="10" y1="146" x2="10" y2="184" stroke="#3a5145" stroke-width="2"/>
    <g transform="translate(0,198)"><circle cx="10" cy="0" r="6" fill="#58a17b"/><text x="30" y="7">review diff → PR</text></g>
    <line x1="10" y1="212" x2="10" y2="250" stroke="#3a5145" stroke-width="2"/>
    <g transform="translate(0,264)" font-weight="700" fill="#8fd0ac"><circle cx="10" cy="0" r="6" fill="#8fd0ac"/><text x="30" y="7">release · live preview</text></g>
    <!-- the loop closes: release feeds the next dispatch -->
    <path d="M10 280 q -40 0 -40 -44 v -192 q 0 -44 40 -44" fill="none" stroke="#3a5145" stroke-width="2" stroke-dasharray="5 5"/>
    <polygon points="10,0 2,-6 2,6" fill="#3a5145"/>
  </g>

  <text x="96" y="600" font-size="20" fill="#6f877b">github.com/zippo1908/agentcell  ·  Apache-2.0</text>
</svg>
