# Minimal install manifest (Helm chart supersedes this at M10):
#   kubectl apply -f config/crd/ -f config/install.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: agentcell-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: celld
  namespace: agentcell-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agentcell-celld
rules:
  - apiGroups: ["agentcell.io"]
    resources: ["cells", "sessions"]
    verbs: ["*"]
  - apiGroups: ["agentcell.io"]
    resources: ["cells/status", "sessions/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    # serviceaccounts: broker mode creates a per-role SA in every Cell
    # namespace; without this the default install cannot reconcile a Cell at
    # all. configmaps: the uid allocator's record (ADR-0009).
    # pods/exec: the console reaches a resident session's tmux by
    # exec'ing in, rather than by giving the session pod an API token
    # it would run untrusted code alongside (ADR-0005).
    resources: ["namespaces", "persistentvolumeclaims", "secrets", "services", "pods", "pods/exec", "serviceaccounts", "configmaps"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments"]
    verbs: ["*"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["*"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentcell-celld
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agentcell-celld
subjects:
  - kind: ServiceAccount
    name: celld
    namespace: agentcell-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celld
  namespace: agentcell-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: celld}
  template:
    metadata:
      labels: {app: celld}
    spec:
      serviceAccountName: celld
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: celld
          image: ghcr.io/agentcell/celld:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--control-namespace=agentcell-system"
            # Route all workload git through the broker so no workload pod
            # holds a forge token (ADR-0005). Remove to use direct mode.
            - "--git-broker-url=http://git-broker.agentcell-system.svc:8080"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          ports:
            - {name: http, containerPort: 8080}
            - {name: preview, containerPort: 8081}
            - {name: metrics, containerPort: 8082}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          volumeMounts:
            - {name: tokens, mountPath: /etc/agentcell/auth, readOnly: true}
            # Audience-bound token so celld can use the broker's narrow
            # forge REST route (ADR-0006) without holding forge creds.
            - {name: git-broker-token, mountPath: /var/run/secrets/agentcell/git-broker, readOnly: true}
      volumes:
        - name: tokens
          secret:
            secretName: celld-tokens
            items:
              - {key: tokens, path: tokens}
        - name: git-broker-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: agentcell-git-broker
                  expirationSeconds: 3600
                  path: token
---
apiVersion: v1
kind: Service
metadata:
  name: celld
  namespace: agentcell-system
spec:
  selector: {app: celld}
  ports:
    - {name: http, port: 80, targetPort: http}
    # Untrusted Cell content is served on its own origin (ADR-0007).
    - {name: preview, port: 8081, targetPort: preview}
---
# git-broker: the only component that holds forge credentials (ADR-0005).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: git-broker
  namespace: agentcell-system
---
# Cluster-scoped: only TokenReview (cluster API) and read pods (for uid /
# ownerReference verification across dynamic cell-<name> namespaces). NO
# cluster-wide secret access — a compromised broker cannot read cluster
# secrets via RBAC.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agentcell-git-broker
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentcell-git-broker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agentcell-git-broker
subjects:
  - kind: ServiceAccount
    name: git-broker
    namespace: agentcell-system
---
# Namespaced: Cell CRs and forge Secrets are read ONLY in the control
# namespace, not cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentcell-git-broker
  namespace: agentcell-system
rules:
  - apiGroups: ["agentcell.io"]
    resources: ["cells"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentcell-git-broker
  namespace: agentcell-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentcell-git-broker
subjects:
  - kind: ServiceAccount
    name: git-broker
    namespace: agentcell-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-broker
  namespace: agentcell-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: git-broker}
  template:
    metadata:
      labels: {app: git-broker}
    spec:
      serviceAccountName: git-broker
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: git-broker
          image: ghcr.io/agentcell/git-broker:latest
          imagePullPolicy: IfNotPresent
          args: ["--control-namespace=agentcell-system"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
---
apiVersion: v1
kind: Service
metadata:
  name: git-broker
  namespace: agentcell-system
spec:
  selector: {app: git-broker}
  ports:
    - {name: http, port: 8080, targetPort: http}
