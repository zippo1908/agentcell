# Values for the internal (on-prem) AgentCell deployment.
#
# This file is CONFIGURATION ONLY. Secrets — API tokens, forge PATs, model
# keys — are created with `kubectl create secret` on the cluster and are
# never committed here. See README.md in this directory.

controlNamespace: agentcell-system

image:
  # Point at wherever the internal registry mirrors the images.
  registry: ghcr.io/zippo1908
  # Bump deliberately, and only to a tag that has been verified here. The
  # cluster runs whatever this says, so "latest" would mean "whatever CI
  # produced last", which is not a deployment decision.
  tag: v0.1.0-alpha.3
  # Always, deliberately. Run 4 lost half an hour to IfNotPresent: a tag
  # already cached on the node was reused, so the cluster silently kept
  # running older code while reporting the new version's tag. Switch to
  # IfNotPresent only once images are mirrored to an internal registry and
  # tags are treated as immutable.
  pullPolicy: Always
  # Name of a docker-registry Secret in controlNamespace; the operator
  # mirrors it into every Cell namespace. Required whenever the images are
  # not public — create it with:
  #   kubectl -n agentcell-system create secret docker-registry regcred \
  #     --docker-server=... --docker-username=... --docker-password=...
  pullSecret: ""

celld:
  replicas: 1          # no leader election yet — keep at 1
  auth:
    existingSecret: celld-tokens   # created out-of-band
  service:
    type: ClusterIP

# Untrusted Cell content gets its own origin per Cell AND zone (ADR-0007).
# Requires a wildcard DNS record and certificate for *.<domain>. Prefer a
# registrable domain that is NOT a parent/sibling of the console's, so no
# subdomain cookie relationship exists.
preview:
  domain: ""           # e.g. agentcell-preview.internal — fill in
  port: 8081
  ingress:
    enabled: false     # set true once DNS + wildcard cert exist
    className: nginx
    tls:
      enabled: false
      secretName: ""   # must cover *.<preview.domain>

# User identity (ADR-0008). Empty keeps the single shared principal that
# static tokens imply — which is honest, but means every Session is owned by
# "whoever had the token". Point this at the Casdoor in deploy/identity/ (or
# any OIDC provider) to get per-user ownership, private runtimes and per-user
# Unix uids (ADR-0009).
oidc:
  issuer: ""
  clientID: ""
  existingSecret: ""   # holds `clientSecret`; created out-of-band

# Preview tickets are signed with this. Empty regenerates per process, so
# preview links break across a celld restart. Create a Secret with key
# `previewKey` once the deployment matters.
previewKeySecret: ""

gitBroker:
  enabled: true
  enforceRefPolicy: true

ingress:
  enabled: false       # console; fill host + TLS when fronted by the gateway
  className: nginx
  host: ""
  tls: {enabled: false, secretName: ""}

storage:
  # Single node: local-path. Multi-node needs RWX (NFS/Ceph/NAS) or a Cell
  # cannot move between nodes.
  className: local-path
