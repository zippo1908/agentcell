# An in-cluster image registry.
#
# Not a nicety. The images agents run are large — a devbox with two agent
# CLIs is several hundred megabytes — and pulling them from a public registry
# across a slow internal link is minutes to hours per node, every time a tag
# changes. On the test cluster a 2 GB image never finished.
#
# With this, an image is pushed once over whatever link the operator has and
# pulled at LAN speed forever after. It also keeps a deployment working when
# the public registry is unreachable, which on a filtered or air-gapped
# network is the normal case rather than an outage.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: agentcell-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: agentcell-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: registry}
  template:
    metadata:
      labels: {app: registry}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: registry
          image: docker.io/library/registry:2
          imagePullPolicy: IfNotPresent
          env:
            - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
              value: /var/lib/registry
            # Deletion enabled so old tags can be reclaimed; without it the
            # PVC grows forever and somebody discovers that at 100%.
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          ports:
            - {name: http, containerPort: 5000}
          volumeMounts:
            - {name: data, mountPath: /var/lib/registry}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 1Gi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: registry-data}
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: agentcell-system
spec:
  type: NodePort
  selector: {app: registry}
  ports:
    # A fixed node port, so the containerd rewrite and anyone pushing from a
    # laptop can name one stable address.
    - {name: http, port: 5000, targetPort: http, nodePort: 30500}
