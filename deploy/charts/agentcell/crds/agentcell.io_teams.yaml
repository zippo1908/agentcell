---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: teams.agentcell.io
spec:
  group: agentcell.io
  names:
    kind: Team
    listKind: TeamList
    plural: teams
    shortNames:
    - tm
    singular: team
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: Display
      type: string
    - jsonPath: .status.members
      name: Members
      type: integer
    - jsonPath: .status.cells
      name: Cells
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              description:
                maxLength: 1000
                type: string
              displayName:
                description: DisplayName is what people call it; the object name is
                  a label-safe id.
                maxLength: 200
                type: string
              members:
                description: |-
                  Members are the people in the team and the role they carry into every
                  Cell that names it. A Cell may still name somebody explicitly, and
                  that entry wins — for raising a role or lowering it.
                items:
                  description: |-
                    Member is one user's role. UserID is the hashed principal id, the same
                    value a Session records as its owner.
                  properties:
                    role:
                      description: Role is what a member may do in a Cell.
                      enum:
                      - viewer
                      - member
                      - maintainer
                      type: string
                    userID:
                      maxLength: 63
                      type: string
                  required:
                  - role
                  - userID
                  type: object
                type: array
            type: object
          status:
            properties:
              cellNames:
                description: |-
                  CellNames is which projects this team governs. Recorded because the
                  question "what does removing this person actually affect" has to be
                  answerable before the removal, not after.
                items:
                  type: string
                type: array
              cells:
                type: integer
              members:
                description: |-
                  Members and Cells are counts, so a list page does not have to fetch
                  every team's full membership to say how big it is.
                type: integer
              observedGeneration:
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
