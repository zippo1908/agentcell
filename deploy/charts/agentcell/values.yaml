# AgentCell default values. See deploy/presets/ for k3s / ACK / TKE overlays.

# Namespace holding the control plane and Cell/Session CRs.
controlNamespace: agentcell-system

image:
  registry: ghcr.io/zippo1908
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent
  # Name of a docker-registry Secret in controlNamespace, for private
  # registries — the common case on private clouds. The operator mirrors it
  # into every Cell namespace, since kubelet resolves pull secrets locally.
  # Create it yourself, e.g.
  #   kubectl -n agentcell-system create secret docker-registry regcred \
  #     --docker-server=... --docker-username=... --docker-password=...
  pullSecret: ""

celld:
  replicas: 1        # celld has no leader election — keep at 1
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
  service:
    type: ClusterIP
    port: 80
  # Access tokens for the HTTP surface. Either provide them here (they are
  # written into a Secret) or set existingSecret to one you created.
  auth:
    tokens: []           # e.g. ["<random-hex>"]
    existingSecret: ""   # Secret with key "tokens"
    # Refuse-to-start is the default; only set for throwaway dev clusters.
    allowNoAuth: false

# git-broker: the only component holding forge credentials (ADR-0005).
# Untrusted Cell content (ADR-0007). Each Cell ZONE gets its own host under
# previewDomain: <cell>-dev.<domain> and <cell>-prod.<domain>. REQUIRED for
# multi-tenant or untrusted-repo deployments; without it every Cell and zone
# shares one origin and only path-scoped tickets separate them.
preview:
  # e.g. preview.example.com — needs a wildcard DNS record (*.preview…)
  # and a wildcard certificate.
  domain: ""
  port: 8081
  ingress:
    enabled: false
    className: ""
    annotations: {}
    tls:
      enabled: false
      secretName: ""   # must cover *.<preview.domain>

gitBroker:
  enabled: true
  replicas: 1
  enforceRefPolicy: true   # pushes limited to create-only session/<id>
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

ingress:
  enabled: false
  className: ""
  host: ""
  tls:
    enabled: false
    secretName: ""
  annotations: {}

# Storage defaults applied to Cells that don't set their own.
storage:
  className: ""       # "" = cluster default; set an RWX class for multi-node

rbac:
  create: true

serviceAccount:
  create: true
  celldName: celld
  brokerName: git-broker
