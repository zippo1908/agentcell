# AgentCell default values. See deploy/presets/ for k3s / ACK / TKE overlays.

# Namespace holding the control plane and Cell/Session CRs.
controlNamespace: agentcell-system

image:
  registry: ghcr.io/zippo1908
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent
  # Name of a docker-registry Secret in controlNamespace, for private
  # registries — the common case on private clouds. The operator mirrors it
  # into every Cell namespace, since kubelet resolves pull secrets locally.
  # Create it yourself, e.g.
  #   kubectl -n agentcell-system create secret docker-registry regcred \
  #     --docker-server=... --docker-username=... --docker-password=...
  pullSecret: ""

celld:
  # Leader election means only one replica reconciles, so >1 is safe for the
  # controllers. It is not automatically safe for previews: set
  # previewKeySecret as well, or the chart refuses to render.
  replicas: 1
  leaderElect: true
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
  service:
    type: ClusterIP
    port: 80
  # Access tokens for the HTTP surface. Either provide them here (they are
  # written into a Secret) or set existingSecret to one you created.
  auth:
    tokens: []           # e.g. ["<random-hex>"]
    existingSecret: ""   # Secret with key "tokens"
    # Refuse-to-start is the default; only set for throwaway dev clusters.
    allowNoAuth: false

# git-broker: the only component holding forge credentials (ADR-0005).
# Untrusted Cell content (ADR-0007). Each Cell ZONE gets its own host under
# previewDomain: <cell>-dev.<domain> and <cell>-prod.<domain>. REQUIRED for
# multi-tenant or untrusted-repo deployments; without it every Cell and zone
# shares one origin and only path-scoped tickets separate them.
preview:
  # e.g. preview.example.com — needs a wildcard DNS record (*.preview…)
  # and a wildcard certificate.
  domain: ""
  port: 8081
  ingress:
    enabled: false
    className: ""
    annotations: {}
    tls:
      enabled: false
      secretName: ""   # must cover *.<preview.domain>

# User identity (ADR-0008). With an issuer configured, every Session records
# its creator, another user's running session is invisible, and a model
# credential can only be spent by its owner. Without one, AgentCell runs as a
# single shared principal exactly as before.
#
# celld verifies the ID token itself, so ANY standards-compliant provider
# works and no gateway is required. See deploy/identity/ for a Casdoor +
# Apache APISIX® path.
# People with accounts: invitations, email login, one principal per human.
#
# Off by default, because the smallest useful deployment is one operator with
# a token and saying so is more honest than implying isolation that is not
# there. Turned on, celld keeps people, invitations, lent credentials and
# linked forge identities in ONE SQLite file on a volume.
#
# One writer. SQLite allows exactly one, so the chart refuses to render with
# more than one celld replica rather than installing two account systems
# wearing one name.
accounts:
  enabled: false
  # Where the file lives. Its directory is what gets the volume.
  db: /var/lib/agentcell/agentcell.db
  # Email of the first administrator, created once if the table is empty.
  # Requires bootstrapPasswordSecret — a password does not go in values.
  bootstrapAdmin: ""
  # Secret with key `password`, read as AGENTCELL_BOOTSTRAP_PASSWORD.
  bootstrapPasswordSecret: ""
  persistence:
    # Bring your own claim if you have one; otherwise the chart makes it.
    existingClaim: ""
    size: 1Gi
    accessMode: ReadWriteOnce
    storageClass: ""

oidc:
  issuer: ""             # e.g. https://casdoor.example.com
  clientID: ""
  # Secret holding key `clientSecret`. Never put the secret in values.
  existingSecret: ""
  # Absolute callback URL; empty derives it from the console's own origin,
  # which is right for port-forward, ingress and gateway alike.
  redirectURL: ""

# Signing material for preview tickets. Leave empty and celld generates it
# per process — correct, but preview links stop working across a restart or
# a second replica. Point at a Secret with key `previewKey` to pin it.
previewKeySecret: ""

# Preset overlays merged over the built-in tables at startup.
#
# A CLI's flags and a provider's endpoints change faster than AgentCell
# releases do, so both are data. Map filename -> YAML content; celld merges
# them in filename order, and later files win per entry.
#
#   presets:
#     runners:
#       kimi.yaml: |
#         version: 1
#         runners:
#           kimi:
#             protocols: [anthropic]
#             headless: ["kimi", "--yes", "-p", "{{task}}"]
#             session_id: uuid
#             resume: ["kimi", "--yes", "--resume", "{{session}}", "-p", "{{task}}"]
#   presets:
#     devboxes:
#       local.yaml: |
#         version: 1
#         devboxes:
#           - name: slim
#             display_name: 标准(轻)
#             image: registry.internal:5000/devbox-slim:v1
#             description: alpine · Claude Code + Codex + Kimi + git/tmux
#             size: 814MB
#
# The built-in catalogue names images on ghcr.io. A cluster that cannot reach
# ghcr.io needs this overlay, or every new project starts in ImagePullBackOff
# — and the create-a-project form offers the unreachable image by default.
presets:
  providers: {}
  runners: {}
  devboxes: {}

gitBroker:
  enabled: true
  replicas: 1
  enforceRefPolicy: true   # pushes limited to create-only session/<id>
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

# Egress: the one way out of a cell namespace.
#
# Ships OBSERVING. Every destination is allowed and every one is recorded,
# so the allowlist can be discovered from a real working week rather than
# guessed. Turning `observe` off is the moment every outbound call starts
# depending on the list being complete — and a wrong list does not degrade
# gracefully, it stops model calls.
#
# Forcing traffic through the proxy (NetworkPolicy: egress only to it) is a
# separate step and deliberately not automatic. See docs/adr/0017.
egress:
  enabled: true
  replicas: 1
  observe: true
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
  # The file the proxy reads. `observe` here overrides the flag, so the mode
  # sits next to the list it applies to.
  policy:
    observe: true
    allow:
      - {host: "api.moonshot.cn", note: "Kimi 模型 API"}
      - {host: "api.anthropic.com", note: "Claude 模型 API"}
      - {host: "api.openai.com", note: "OpenAI 模型 API"}
      - {host: "github.com", note: "代码托管"}
      - {host: "*.githubusercontent.com", note: "raw / release 资源"}
      - {host: "registry.npmjs.org", note: "npm"}
      - {host: "pypi.org", note: "pip"}
      - {host: "files.pythonhosted.org", note: "pip 包体"}
      - {host: "proxy.golang.org", note: "Go module proxy"}

ingress:
  enabled: false
  className: ""
  host: ""
  tls:
    enabled: false
    secretName: ""
  annotations: {}

# Storage defaults applied to Cells that don't set their own.
storage:
  className: ""       # "" = cluster default; set an RWX class for multi-node

rbac:
  create: true

serviceAccount:
  create: true
  celldName: celld
  brokerName: git-broker
