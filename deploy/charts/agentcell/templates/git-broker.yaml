{{- if .Values.gitBroker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.serviceAccount.brokerName }}
  namespace: {{ .Values.controlNamespace }}
  labels: {{- include "agentcell.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gitBroker.replicas }}
  selector:
    matchLabels: {app: git-broker}
  template:
    metadata:
      labels:
        app: git-broker
        {{- include "agentcell.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.brokerName }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: git-broker
          image: {{ include "agentcell.image" (dict "Values" .Values "Chart" .Chart "component" "git-broker") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--control-namespace={{ .Values.controlNamespace }}"
            - "--enforce-ref-policy={{ .Values.gitBroker.enforceRefPolicy }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          resources: {{- toYaml .Values.gitBroker.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.serviceAccount.brokerName }}
  namespace: {{ .Values.controlNamespace }}
  labels: {{- include "agentcell.labels" . | nindent 4 }}
spec:
  selector: {app: git-broker}
  ports:
    - {name: http, port: 8080, targetPort: http}
{{- end }}
