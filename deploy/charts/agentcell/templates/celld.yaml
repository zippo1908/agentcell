{{- if .Values.accounts.enabled }}
{{- /*
  SQLite takes ONE writer. Two celld replicas each open their own file on
  their own volume and answer as if they were one account system: somebody
  invited on replica A cannot log in on replica B, and whichever replica
  answers a password change leaves the other still accepting the old one.
  That is not a degraded mode, it is two products wearing one name — so this
  refuses to render rather than installing something that looks fine until
  the second person joins.
*/}}
{{- if gt (int .Values.celld.replicas) 1 }}
{{- fail "accounts.enabled=true 只支持单个 celld 副本(SQLite 一次只允许一个写者)。要多副本,先实现并验证共享数据库方案;现在请把 celld.replicas 设为 1。" }}
{{- end }}
{{- if and .Values.accounts.bootstrapAdmin (not .Values.accounts.bootstrapPasswordSecret) }}
{{- fail "设置了 accounts.bootstrapAdmin 就必须给 accounts.bootstrapPasswordSecret:第一个管理员的密码只能来自 Secret,不能写在 values 里。" }}
{{- end }}
{{- end }}
{{- if and (not .Values.celld.auth.existingSecret) .Values.celld.auth.tokens }}
apiVersion: v1
kind: Secret
metadata:
  name: celld-tokens
  namespace: {{ .Values.controlNamespace }}
  labels: {{- include "agentcell.labels" . | nindent 4 }}
stringData:
  tokens: {{ join "\n" .Values.celld.auth.tokens | quote }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celld
  namespace: {{ .Values.controlNamespace }}
  labels: {{- include "agentcell.labels" . | nindent 4 }}
{{- if and (gt (int .Values.celld.replicas) 1) (not .Values.previewKeySecret) }}
{{- fail "celld.replicas > 1 needs previewKeySecret: preview tickets are signed with per-process key material otherwise, so a ticket minted by one replica is refused by the others and previews fail intermittently under load. Create a Secret with a `previewKey` entry and set previewKeySecret." }}
{{- end }}
spec:
  replicas: {{ .Values.celld.replicas }}
  selector:
    matchLabels: {app: celld}
  template:
    metadata:
      labels:
        app: celld
        {{- include "agentcell.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.celldName }}
      {{- with .Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: celld
          image: {{ include "agentcell.image" (dict "Values" .Values "Chart" .Chart "component" "celld") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--control-namespace={{ .Values.controlNamespace }}"
            {{- with (include "agentcell.brokerURL" .) }}
            - "--git-broker-url={{ . }}"
            {{- end }}
            {{- with .Values.image.pullSecret }}
            - "--image-pull-secret={{ . }}"
            {{- end }}
            - "--preview-addr=:{{ .Values.preview.port }}"
            - "--metrics-addr=:8082"
            - "--leader-elect={{ .Values.celld.leaderElect }}"
            {{- with .Values.preview.domain }}
            - "--preview-domain={{ . }}"
            {{- end }}
            {{- if .Values.celld.auth.allowNoAuth }}
            - "--allow-no-auth"
            {{- end }}
            {{- if .Values.accounts.enabled }}
            - "--db={{ .Values.accounts.db }}"
            {{- with .Values.accounts.bootstrapAdmin }}
            - "--bootstrap-admin={{ . }}"
            {{- end }}
            {{- end }}
            {{- with .Values.oidc.issuer }}
            - "--oidc-issuer={{ . }}"
            {{- end }}
            {{- with .Values.oidc.clientID }}
            - "--oidc-client-id={{ . }}"
            {{- end }}
            {{- with .Values.oidc.redirectURL }}
            - "--oidc-redirect-url={{ . }}"
            {{- end }}
          {{- if or .Values.oidc.existingSecret .Values.previewKeySecret .Values.accounts.bootstrapPasswordSecret }}
          env:
            {{- with .Values.accounts.bootstrapPasswordSecret }}
            # Read from a Secret, never from values: a password in values ends
            # up in `helm get values`, in CI logs and in whatever holds the
            # release history.
            - name: AGENTCELL_BOOTSTRAP_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ . }}, key: password}
            {{- end }}
            {{- with .Values.oidc.existingSecret }}
            # The client secret is read from a Secret, never from values.
            - name: AGENTCELL_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: {{ . }}, key: clientSecret}
            {{- end }}
            {{- with .Values.previewKeySecret }}
            - name: AGENTCELL_PREVIEW_KEY
              valueFrom:
                secretKeyRef: {name: {{ . }}, key: previewKey}
            {{- end }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          ports:
            - {name: http, containerPort: 8080}
            - {name: preview, containerPort: {{ .Values.preview.port }}}
            - {name: metrics, containerPort: 8082}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          resources: {{- toYaml .Values.celld.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.presets.providers }}
            - {name: providers-d, mountPath: /etc/agentcell/providers.d, readOnly: true}
            {{- end }}
            {{- if .Values.presets.devboxes }}
            - {name: devboxes-d, mountPath: /etc/agentcell/devboxes.d, readOnly: true}
            {{- end }}
            {{- if .Values.presets.runners }}
            - {name: runners-d, mountPath: /etc/agentcell/runners.d, readOnly: true}
            {{- end }}
            {{- if or .Values.celld.auth.existingSecret .Values.celld.auth.tokens }}
            - {name: tokens, mountPath: /etc/agentcell/auth, readOnly: true}
            {{- end }}
            {{- if .Values.gitBroker.enabled }}
            - {name: git-broker-token, mountPath: /var/run/secrets/agentcell/git-broker, readOnly: true}
            {{- end }}
            {{- if .Values.accounts.enabled }}
            - {name: accounts, mountPath: {{ dir .Values.accounts.db }}}
            {{- end }}
      volumes:
        {{- if .Values.presets.providers }}
        - name: providers-d
          configMap: {name: agentcell-providers}
        {{- end }}
        {{- if .Values.presets.runners }}
        - name: runners-d
          configMap: {name: agentcell-runners}
        {{- end }}
        {{- if .Values.presets.devboxes }}
        - name: devboxes-d
          configMap: {name: agentcell-devboxes}
        {{- end }}
        {{- if or .Values.celld.auth.existingSecret .Values.celld.auth.tokens }}
        - name: tokens
          secret:
            secretName: {{ .Values.celld.auth.existingSecret | default "celld-tokens" }}
            items:
              - {key: tokens, path: tokens}
        {{- end }}
        {{- if .Values.accounts.enabled }}
        - name: accounts
          persistentVolumeClaim:
            claimName: {{ .Values.accounts.persistence.existingClaim | default "celld-accounts" }}
        {{- end }}
        {{- if .Values.gitBroker.enabled }}
        - name: git-broker-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: agentcell-git-broker
                  expirationSeconds: 3600
                  path: token
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: celld
  namespace: {{ .Values.controlNamespace }}
  labels: {{- include "agentcell.labels" . | nindent 4 }}
spec:
  type: {{ .Values.celld.service.type }}
  selector: {app: celld}
  ports:
    - {name: http, port: {{ .Values.celld.service.port }}, targetPort: http}
    - {name: preview, port: {{ .Values.preview.port }}, targetPort: preview}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: celld
  namespace: {{ .Values.controlNamespace }}
  labels: {{- include "agentcell.labels" . | nindent 4 }}
  annotations: {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: celld
                port: {number: {{ .Values.celld.service.port }}}
{{- end }}

{{- if and .Values.preview.ingress.enabled .Values.preview.domain }}
---
# Untrusted content: a wildcard host so每 Cell zone gets its own origin.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: celld-preview
  namespace: {{ .Values.controlNamespace }}
  labels: {{- include "agentcell.labels" . | nindent 4 }}
  annotations: {{- toYaml .Values.preview.ingress.annotations | nindent 4 }}
spec:
  {{- with .Values.preview.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.preview.ingress.tls.enabled }}
  tls:
    - hosts: ["*.{{ .Values.preview.domain }}"]
      secretName: {{ .Values.preview.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: "*.{{ .Values.preview.domain }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: celld
                port: {number: {{ .Values.preview.port }}}
{{- end }}

{{- if and .Values.accounts.enabled (not .Values.accounts.persistence.existingClaim) }}
---
# The accounts database. One file, on one volume, written by one celld.
#
# ReadWriteOnce is not a limitation to work around here: it matches what
# SQLite can actually support, and a volume that let two writers in would
# only make the failure quieter.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: celld-accounts
  namespace: {{ .Values.controlNamespace }}
  labels: {{- include "agentcell.labels" . | nindent 4 }}
spec:
  accessModes: [{{ .Values.accounts.persistence.accessMode }}]
  resources:
    requests:
      storage: {{ .Values.accounts.persistence.size }}
  {{- with .Values.accounts.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
