{{- if .Values.egress.enabled }}
# The one way out of a cell namespace.
#
# Ships in OBSERVE mode: every destination is allowed and every one is
# recorded. The allowlist is meant to be discovered from those records — a
# guessed list turned on straight away takes out every agent's model call,
# and that failure is not graceful.
#
# Closing the direct route (NetworkPolicy: egress only to this proxy) is a
# SEPARATE step, taken once the list has been proven against a real working
# week. Until then this observes traffic that reaches it and nothing is
# forced through it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: egress-policy
  namespace: {{ .Values.controlNamespace }}
  labels: {{- include "agentcell.labels" . | nindent 4 }}
data:
  egress.json: |
    {{- toJson .Values.egress.policy | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: egress-proxy
  namespace: {{ .Values.controlNamespace }}
  labels: {{- include "agentcell.labels" . | nindent 4 }}
---
# Attribution needs to read pods (to turn a client address into a pod) and
# sessions (to turn a pod into the principal that owns it). Read-only, and
# nothing else: this component decides about network destinations, not about
# people.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-egress-proxy
  labels: {{- include "agentcell.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["agentcell.io"]
    resources: ["sessions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-egress-proxy
  labels: {{- include "agentcell.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-egress-proxy
subjects:
  - kind: ServiceAccount
    name: egress-proxy
    namespace: {{ .Values.controlNamespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress-proxy
  namespace: {{ .Values.controlNamespace }}
  labels: {{- include "agentcell.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.egress.replicas }}
  selector:
    matchLabels: {app: egress-proxy}
  template:
    metadata:
      labels:
        app: egress-proxy
        {{- include "agentcell.labels" . | nindent 8 }}
    spec:
      serviceAccountName: egress-proxy
      {{- with .Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: egress-proxy
          image: {{ include "agentcell.image" (dict "Values" .Values "Chart" .Chart "component" "egress-proxy") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--addr=:3128"
            - "--control-namespace={{ .Values.controlNamespace }}"
            - "--policy=/etc/agentcell/egress.json"
            - "--observe={{ .Values.egress.observe }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          ports:
            - {name: proxy, containerPort: 3128}
          volumeMounts:
            - {name: policy, mountPath: /etc/agentcell, readOnly: true}
          resources: {{- toYaml .Values.egress.resources | nindent 12 }}
      volumes:
        - name: policy
          configMap: {name: egress-policy}
---
apiVersion: v1
kind: Service
metadata:
  name: egress-proxy
  namespace: {{ .Values.controlNamespace }}
  labels: {{- include "agentcell.labels" . | nindent 4 }}
spec:
  selector: {app: egress-proxy}
  ports:
    - {name: proxy, port: 3128, targetPort: proxy}
{{- end }}
